name: Self-Heal Tests

on:
  # Automatically triggered when the main test workflow fails.
  workflow_run:
    workflows: ['Playwright Tests']
    types: [completed]
  # Can also be triggered manually (useful for local testing of the pipeline).
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser artifact to heal (matches the matrix value in the test workflow)'
        required: false
        default: 'chromium'

concurrency:
  group: self-heal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-heal:
    # Only run when the triggering workflow actually failed, or on manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    timeout-minutes: 15

    services:
      rolnopol:
        image: jaktestowac/rolnopol:latest
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 1
          --health-start-period 10s

    permissions:
      contents: write # push heal branch
      pull-requests: write # open PR

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Use a PAT so the PR created here triggers the test workflow.
          # Fall back to GITHUB_TOKEN (PR won't auto-trigger CI in that case).
          token: ${{ secrets.HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Wait for rolnopol service
        run: |
          timeout 10s bash -c 'until curl -fsS http://rolnopol:3000/api/v1/healthcheck >/dev/null 2>&1; do sleep 1; done' || { echo "rolnopol failed to become ready in time" >&2; exit 1; }
          echo "rolnopol is ready"

      - name: Resolve browser name
        id: browser
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.browser }}" >> $GITHUB_OUTPUT
          else
            echo "name=chromium" >> $GITHUB_OUTPUT
          fi

      - name: Download failures artifact
        uses: actions/download-artifact@v6
        with:
          name: test-failures-${{ steps.browser.outputs.name }}
          path: test-results/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run self-healing agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.HEAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch || 'master' }}
          BASE_URL: http://rolnopol:3000
        run: npx tsx scripts/heal.ts
