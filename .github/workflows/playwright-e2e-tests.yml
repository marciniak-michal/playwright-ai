name: Playwright Tests Dev

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    environment: dev
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      E2E_LOGIN_EMAIL: ${{ secrets.E2E_LOGIN_EMAIL }}
      E2E_LOGIN_PASSWORD: ${{ secrets.E2E_LOGIN_PASSWORD }}
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required variables
        run: |
          missing=()
          [ -z "$BASE_URL" ]          && missing+=("BASE_URL")
          [ -z "$E2E_LOGIN_EMAIL" ]    && missing+=("E2E_LOGIN_EMAIL")
          [ -z "$E2E_LOGIN_PASSWORD" ] && missing+=("E2E_LOGIN_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            for var in "${missing[@]}"; do
              echo "::error::$var is not set. Configure it in the 'dev' GitHub environment."
            done
            exit 1
          fi
          echo "All required variables are configured."

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests Dev
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload test failures artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-failures-${{ matrix.browser }}
          path: test-results/failures.json
          retention-days: 1

      - name: Upload Playwright report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
