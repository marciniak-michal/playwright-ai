name: Playwright Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        browser: [chromium]

    services:
      rolnopol:
        image: jaktestowac/rolnopol:latest
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 1
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Wait for rolnopol service
        run: |
          timeout 10s bash -c 'until curl -fsS http://rolnopol:3000/api/v1/healthcheck >/dev/null 2>&1; do sleep 1; done' || { echo "rolnopol failed to become ready in time" >&2; exit 1; }
          echo "rolnopol is ready"

      - name: Run smoke tests
        env:
          BASE_URL: http://rolnopol:3000
        run: npx playwright test --grep @smoke --project=${{ matrix.browser }}

      - name: Upload test failures artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ matrix.browser }}
          path: test-results/failures.json
          retention-days: 1

      - name: Upload Playwright report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
